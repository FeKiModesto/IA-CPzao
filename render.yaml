databases:
  - name: assistente-db
    plan: free
    databaseName: assistente

services:
  - type: web
    name: assistente-disruptive
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # você cola o valor no painel do Render; nunca vai para o Git
      - key: DATABASE_URL
        fromDatabase:
          name: assistente-db
          property: connectionString
