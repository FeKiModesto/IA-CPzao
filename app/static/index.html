<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente Disruptive Architectures</title>
<style>
  :root {
    --bg:#f6f7fb; --panel:#fff; --text:#1b1d2a; --muted:#6a6f85; --border:#e2e4ee;
    --accent:#5b3fd4; --accent-fg:#fff; --user:#5b3fd4; --bot:#eef0f8; --code:#e9ebf5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12131a; --panel:#1b1d28; --text:#e8e9f2; --muted:#9a9fb5; --border:#2c2f3f;
      --accent:#8b73ff; --accent-fg:#12131a; --user:#5b3fd4; --bot:#262938; --code:#14151d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .app { max-width:820px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding:0 16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0 10px; }
  h1 { font-size:17px; margin:0; }
  header small { color:var(--muted); display:block; font-weight:400; font-size:12.5px; }
  button { font:inherit; cursor:pointer; }
  .ghost { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:6px 10px; font-size:13px; }
  .ghost:hover { color:var(--text); border-color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:8px 2px 16px; scroll-behavior:smooth; }
  .msg { display:flex; margin:14px 0; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:88%; padding:10px 14px; border-radius:14px; overflow-wrap:anywhere; }
  .user .bubble { background:var(--user); color:#fff; border-bottom-right-radius:4px; white-space:pre-wrap; }
  .bot .bubble { background:var(--bot); border-bottom-left-radius:4px; }
  .bubble p { margin:0 0 8px; } .bubble p:last-child { margin-bottom:0; }
  .bubble ul, .bubble ol { margin:4px 0 8px; padding-left:22px; }
  .bubble code { background:var(--code); padding:1px 5px; border-radius:5px; font-size:13px; }
  .bubble pre { background:var(--code); padding:10px 12px; border-radius:8px; overflow-x:auto; margin:8px 0; }
  .bubble pre code { background:none; padding:0; }
  .bubble a { color:var(--accent); }
  sup.cite { font-size:11px; font-weight:600; color:var(--accent); }
  .sources { margin-top:10px; border-top:1px solid var(--border); padding-top:8px; display:grid; gap:6px; }
  .src { font-size:12.5px; color:var(--muted); }
  .src a { color:var(--accent); font-weight:600; text-decoration:none; }
  .src a:hover { text-decoration:underline; }
  .src span { display:block; }
  .tools { margin-top:8px; display:flex; gap:6px; align-items:center; color:var(--muted); font-size:12px; }
  .tools button { background:none; border:1px solid var(--border); border-radius:6px; padding:1px 8px; color:var(--muted); }
  .tools button.on { border-color:var(--accent); color:var(--accent); }
  .typing { color:var(--muted); font-style:italic; }
  .error .bubble { background:#fde8e8; color:#8a1c1c; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .chips button { background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:7px 13px; font-size:13.5px; }
  .chips button:hover { border-color:var(--accent); }
  .welcome h2 { margin:24px 0 4px; font-size:20px; } .welcome p { color:var(--muted); margin:0; }
  form { display:flex; gap:8px; padding:10px 0 16px; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:11px 14px; font:inherit; max-height:140px; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:0; }
  .send { background:var(--accent); color:var(--accent-fg); border:none; border-radius:12px; padding:0 20px; font-weight:600; }
  .send:disabled { opacity:.5; cursor:wait; }
  footer { text-align:center; color:var(--muted); font-size:11.5px; padding-bottom:10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Assistente do curso<small>Disruptive Architectures · respostas baseadas no site da matéria</small></h1>
    <button class="ghost" id="new" type="button">Nova conversa</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <textarea id="q" rows="1" maxlength="1000" placeholder="Pergunte sobre o conteúdo do curso..." aria-label="Pergunta"></textarea>
    <button class="send" id="send" type="submit">Enviar</button>
  </form>
  <footer>Pode errar. Confira as fontes citadas em cada resposta.</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), form = $("#form"), input = $("#q"), sendBtn = $("#send");
const SUGGESTIONS = [
  "O que é RAG e como funciona no Lab 4?",
  "O que o Lab 3.5 pede para entregar?",
  "Como funciona o protocolo MQTT?",
  "Qual a diferença entre System Prompt e histórico da conversa?",
];

let sessionId = null;
try { sessionId = localStorage.getItem("session_id"); } catch {}

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Markdown mínimo e seguro: escapa o HTML primeiro, depois aplica a formatação.
function md(text) {
  const blocks = [];
  let t = esc(text).replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
    blocks.push(`<pre><code>${code.replace(/\n$/, "")}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(\d{1,2})\]/g, '<sup class="cite">[$1]</sup>');
  const out = [];
  for (const para of t.split(/\n{2,}/)) {
    const lines = para.split("\n");
    if (lines.every((l) => /^\s*[-*]\s+/.test(l))) {
      out.push("<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`).join("") + "</ul>");
    } else if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l))) {
      out.push("<ol>" + lines.map((l) => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>");
    } else if (/^#{1,6}\s/.test(lines[0])) {
      out.push(`<p><strong>${inline(lines[0].replace(/^#{1,6}\s+/, ""))}</strong></p>`);
      if (lines.length > 1) out.push(`<p>${inline(lines.slice(1).join("<br>"))}</p>`);
    } else {
      out.push(`<p>${inline(lines.join("<br>"))}</p>`);
    }
  }
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

function scrollDown() { log.scrollTop = log.scrollHeight; }

function addUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  log.appendChild(el); scrollDown();
}

function addBot(data, withTools = true) {
  const el = document.createElement("div");
  el.className = "msg bot";
  const sources = (data.sources || []).map((s) =>
    `<div class="src"><a href="${esc(s.url)}" target="_blank" rel="noopener">[${s.n}] ${esc(s.title)}</a> · ${esc(s.section)}<span>${esc(s.snippet)}…</span></div>`).join("");
  el.innerHTML = `<div class="bubble">${md(data.answer)}
    ${sources ? `<div class="sources">${sources}</div>` : ""}
    ${withTools && data.interaction_id ? `<div class="tools">Essa resposta ajudou?
      <button data-v="1" aria-label="Útil">👍</button><button data-v="-1" aria-label="Não ajudou">👎</button></div>` : ""}</div>`;
  const tools = el.querySelector(".tools");
  if (tools) {
    if (data.feedback) tools.querySelector(`[data-v="${data.feedback}"]`)?.classList.add("on");
    tools.addEventListener("click", async (e) => {
      const b = e.target.closest("button"); if (!b) return;
      tools.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      fetch("/feedback", { method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ interaction_id: data.interaction_id, session_id: sessionId, value: +b.dataset.v }) }).catch(() => {});
    });
  }
  log.appendChild(el); scrollDown();
}

function addError(text) {
  const el = document.createElement("div");
  el.className = "msg bot error";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  log.appendChild(el); scrollDown();
}

function welcome() {
  log.innerHTML = `<div class="welcome"><h2>Olá! 👋</h2><p>Pergunte sobre as aulas, laboratórios e exercícios de IA e IoT.</p>
    <div class="chips">${SUGGESTIONS.map((s) => `<button type="button">${esc(s)}</button>`).join("")}</div></div>`;
  log.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
}

async function ask(question) {
  question = question.trim(); if (!question || sendBtn.disabled) return;
  log.querySelector(".welcome")?.remove();
  addUser(question);
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;
  const typing = document.createElement("div");
  typing.className = "msg bot";
  typing.innerHTML = '<div class="bubble typing">Consultando o material…</div>';
  log.appendChild(typing); scrollDown();
  try {
    const res = await fetch("/chat", { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ question, session_id: sessionId }) });
    typing.remove();
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addError(err.detail || "Algo deu errado. Tente novamente.");
    } else {
      const data = await res.json();
      sessionId = data.session_id;
      try { localStorage.setItem("session_id", sessionId); } catch {}
      addBot(data);
    }
  } catch {
    typing.remove(); addError("Sem conexão com o servidor.");
  } finally {
    sendBtn.disabled = false; input.focus();
  }
}

async function restore() {
  if (!sessionId) return welcome();
  try {
    const rows = await (await fetch(`/history?session_id=${encodeURIComponent(sessionId)}`)).json();
    if (!rows.length) return welcome();
    log.innerHTML = "";
    for (const r of rows) { addUser(r.question); addBot({ ...r, answer: r.answer }); }
  } catch { welcome(); }
}

form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
$("#new").addEventListener("click", () => { sessionId = null; try { localStorage.removeItem("session_id"); } catch {} welcome(); });
restore();
</script>
</body>
</html>
